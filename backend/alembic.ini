# Alembic configuration. The application never reads this file at runtime for its URL or location:
# gtm_studio/db/migrate.py builds a Config in code and passes Settings through. This file exists so the
# plain `alembic` command works from backend/ (it builds Settings() itself).
#
# There is no sqlalchemy.url here on purpose: the URL always comes from Settings (GTM_DB_URL).
# There is no [loggers] section either: env.py must not reconfigure the application's logging.

[alembic]
script_location = %(here)s/src/gtm_studio/db/migrations
# Slugged file names, e.g. 3f2a1c9b0d4e_add_users.py
file_template = %%(rev)s_%%(slug)s
